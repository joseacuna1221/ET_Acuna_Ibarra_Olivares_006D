<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Crear evento</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Crear evento</ion-title>
    </ion-toolbar>
  </ion-header>

  <form>
    <ion-item>
      <ion-label position="stacked">Nombre del evento</ion-label>
      <ion-input type="text" name="nombreEvento" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Juego</ion-label>
      <ion-input type="text" name="juego" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Máximo de participantes</ion-label>
      <ion-input type="number"  name="maxParticipantes" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Máximo de espectadores</ion-label>
      <ion-input type="number"  name="maxEspectadores" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Subir imagen del evento</ion-label>
      <ion-input type="file" accept="image/*" required></ion-input>
    </ion-item>

    <ion-button (click)="mostrarMensaje()"expand="full" type="submit" color="primary" style="margin-top: 20px;">
      Crear Evento
    </ion-button>
  </form>
</ion-content>
