<ion-header>
  <ion-toolbar>

    <ion-back-button 
    defaultHref="/"
    text=""
    color="dark"
    slot="start">
  </ion-back-button>
  
    <ion-title>Recuperar Contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="recoverForm" (ngSubmit)="onSubmit()">
    <ion-item>
      <ion-label position="floating">Correo Electrónico</ion-label>
      <ion-input type="email" formControlName="email"></ion-input>
    </ion-item>
    <div *ngIf="recoverForm.get('email')?.invalid && recoverForm.get('email')?.touched">
      <ion-text color="danger">
        <p>* Correo electrónico válido requerido</p>
      </ion-text>
    </div>

    <ion-button type="submit" expand="block" [disabled]="recoverForm.invalid">Enviar Correo</ion-button>

    <ion-button routerLink="/reset-password" fill="clear" shape="round"> Ingresar token </ion-button>
  </form>
</ion-content>
