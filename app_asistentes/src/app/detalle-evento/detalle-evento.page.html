<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab2" text="" color="dark"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalles del Evento</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card *ngIf="evento">
    <ion-card-header>
      <ion-card-title>{{ evento.nombre }}</ion-card-title>
      <ion-card-subtitle>{{ evento.fecha }} - {{ evento.ubicacion }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>{{ evento.descripcion }}</p>
      <ion-img [src]="evento.imagen || 'https://via.placeholder.com/300'"></ion-img>
      <div style="margin-top: 15px;">
        <p>Participantes: {{ evento.maxParticipantes }}</p>
        <p>Espectadores: {{ evento.maxEspectadores }}</p>
      </div>
      <ion-button expand="full" color="primary" (click)="unirseComoParticipante()">Unirse como Participante</ion-button>
      <ion-button expand="full" color="secondary" (click)="unirseComoEspectador()">Unirse como Espectador</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
