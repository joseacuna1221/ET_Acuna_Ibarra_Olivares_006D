<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button 
          defaultHref="/"
          text=""
          color="dark"></ion-back-button>
    </ion-buttons>
    <ion-title>Contáctanos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Contáctanos</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid class="contact-form-wrapper">
    <ion-row>
      <ion-col size="12">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Envíanos un mensaje</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <form >
              <ion-item>
                <ion-label position="stacked">Nombre Completo</ion-label>
                <ion-input type="text" placeholder="Tu nombre completo" required></ion-input>
              </ion-item>

              <ion-item>
                <ion-label position="stacked">Correo Electrónico</ion-label>
                <ion-input type="email" placeholder="Tu correo electrónico" required></ion-input>
              </ion-item>

              <ion-item>
                <ion-label position="stacked">Teléfono</ion-label>
                <ion-input type="tel" placeholder="Tu teléfono" required></ion-input>
              </ion-item>

              <ion-item>
                <ion-label position="stacked">Mensaje</ion-label>
                <ion-textarea placeholder="Escribe tu mensaje aquí" required></ion-textarea>
              </ion-item>

              <div style="text-align: center; margin-top: 20px;">

                <ion-button (click)="mostrarMensaje()" expand="block" fill="solid" color="primary" shape="round">
                  Enviar Mensaje
                </ion-button>
              </div>
            </form>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
