<ion-app>
  <ion-menu contentId="main" menuId="first" side="start" type="overlay" [disabled]="true">
    <ion-header>
      <ion-toolbar color="tertiary">
        <ion-icon slot="start" name="sparkles-outline" color="dark" size="large" style="padding-left: 15px;"></ion-icon>
        <ion-title>My Tabs</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <ion-item *ngFor="let item of menu" (click)="item.action ? item.action() : null">
          <ion-icon [name]="item.icon"></ion-icon>
          <ion-label>{{ item.name }}</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main"></ion-router-outlet>
</ion-app>
