<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button 
          defaultHref="/tabs/tab1"
          text=""
          color="dark"></ion-back-button>
    </ion-buttons>
    <ion-title>Mis eventos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tab 2</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-button *ngFor="let evento of eventos" class="custom-card" [routerLink]="['/detalle-evento', evento.id]">
    <ion-img [src]="evento.imagen || 'https://via.placeholder.com/300'" class="card-image"></ion-img>
    <div class="overlay">
      <div class="contador">
        <div class="personas">
          <ion-icon name="person"></ion-icon>
          <span>{{  evento.numeroParticipantes }}/{{ evento.maxParticipantes }}</span>
        </div>
        <div class="personas">
          <ion-icon name="people"></ion-icon>
          <span>{{ evento.numeroEspectadores }}/{{ evento.maxEspectadores }}</span>
        </div>
      </div>
    </div>
  </ion-button>  
</ion-content>
